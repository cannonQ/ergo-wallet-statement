name: Monthly LP Data Refresh

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'Which step to run'
        required: true
        type: choice
        options:
          - 1_block_heights
          - 2_lp_token_pairs
          - 3_token_prices
          - 4_lp_valuations
          - 5_derived_files
          - all_sequential
        default: 'all_sequential'
      dry_run:
        description: 'Dry run (no commit/push)'
        required: false
        type: boolean
        default: false

  # Optional: Scheduled run on 1st of each month at 00:10 UTC
  # Uncomment when ready to automate
  # schedule:
  #   - cron: '10 0 1 * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create data directories if needed
        run: |
          mkdir -p data exports

      - name: Run Step 1 - Block Heights
        if: ${{ github.event.inputs.step == '1_block_heights' || github.event.inputs.step == 'all_sequential' }}
        run: |
          echo "=== Running Step 1: Block Heights ==="
          python scripts/refresh_block_heights.py
        continue-on-error: false

      - name: Run Step 2 - LP Token Pairs
        if: ${{ github.event.inputs.step == '2_lp_token_pairs' || github.event.inputs.step == 'all_sequential' }}
        run: |
          echo "=== Running Step 2: LP Token Pairs ==="
          python scripts/refresh_lp_token_pairs.py
        continue-on-error: false

      - name: Run Step 3 - Token Prices
        if: ${{ github.event.inputs.step == '3_token_prices' || github.event.inputs.step == 'all_sequential' }}
        run: |
          echo "=== Running Step 3: Token Prices ==="
          python scripts/refresh_token_prices.py
        continue-on-error: false

      - name: Run Step 4 - LP Valuations
        if: ${{ github.event.inputs.step == '4_lp_valuations' || github.event.inputs.step == 'all_sequential' }}
        run: |
          echo "=== Running Step 4: LP Valuations ==="
          python scripts/refresh_lp_valuations.py
        continue-on-error: false

      - name: Run Step 5 - Derived Files
        if: ${{ github.event.inputs.step == '5_derived_files' || github.event.inputs.step == 'all_sequential' }}
        run: |
          echo "=== Running Step 5: Derived Files ==="
          python scripts/refresh_derived_files.py
        continue-on-error: false

      - name: Check for changes
        id: git_status
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: ${{ steps.git_status.outputs.changes == 'true' && github.event.inputs.dry_run != 'true' }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Add all data and export files
          git add data/ exports/ public/data/

          # Get the month from the latest block heights
          MONTH=$(python -c "import json; d=json.load(open('data/block_heights.json')) if __import__('os').path.exists('data/block_heights.json') else json.load(open('public/data/month_end_block_heights.json')); print(d['months'][-1]['date'])" 2>/dev/null || echo "unknown")

          # Create commit message based on step
          case "${{ github.event.inputs.step }}" in
            1_block_heights)
              MSG="Monthly refresh: block heights for ${MONTH}"
              ;;
            2_lp_token_pairs)
              MSG="Monthly refresh: LP token pairs update"
              ;;
            3_token_prices)
              MSG="Monthly refresh: token prices for ${MONTH}"
              ;;
            4_lp_valuations)
              MSG="Monthly refresh: LP valuations for ${MONTH}"
              ;;
            5_derived_files)
              MSG="Monthly refresh: derived files update"
              ;;
            all_sequential)
              MSG="Monthly refresh: all steps for ${MONTH}"
              ;;
            *)
              MSG="Monthly refresh: ${{ github.event.inputs.step }}"
              ;;
          esac

          git diff --staged --quiet || git commit -m "${MSG}"
          git push

      - name: Upload artifacts (logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-logs-${{ github.run_id }}
          path: |
            data/refresh_log.json
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## Monthly Refresh Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Step:** ${{ github.event.inputs.step }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dry Run:** ${{ github.event.inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "**Changes Detected:** ${{ steps.git_status.outputs.changes }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "data/refresh_log.json" ]; then
            echo "### Refresh Log" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat data/refresh_log.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
